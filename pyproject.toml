[tool.ruff]
line-length = 100
target-version = "py311"

extend-exclude = ["runtime", "build", ".venv", "venv", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    # Длинные строки в HTML/JS-шаблонах и shell-командах читаются лучше в одну строку.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Сборщик установщика: одноразовые скрипты, стиль не критичен.
"installer/build_sfx_proper.py" = ["E501"]

[tool.pylint.main]
py-version = "3.11"
max-line-length = 100
ignore = ["runtime", "build"]

[tool.pylint."messages control"]
disable = [
    "C0114",  # missing-module-docstring
    "C0115",  # missing-class-docstring
    "C0116",  # missing-function-docstring
    "C0415",  # import-outside-toplevel — отложенные импорты clr/toga обязательны
    "C0303",  # trailing-whitespace
    "C0301",  # line-too-long
    "C0103",  # invalid-name
    "C0413",  # wrong-import-position — нужен порядок ради выбора CLR
    "C0411",  # wrong-import-order
    "C0206",  # consider-using-dict-items
    "C0207",  # use-implicit-booleaness
    "C0302",  # too-many-lines
    "C0325",  # superfluous-parens
    "W0511",  # fixme
    "W0603",  # global-statement
    "W0613",  # unused-argument — колбэки Toga требуют полную сигнатуру
    "W0621",  # redefined-outer-name
    "W0707",  # raise-missing-from
    "W0718",  # broad-exception-caught — намеренно глушим сбои нативного слоя
    "W1203",  # logging-f-string
    "W1510",  # subprocess-run-check
    "W0212",  # protected-access — достук к _impl/native неизбежен
    "W0201",  # attribute-defined-outside-init
    "E0401",  # import-error — clr/System/gi есть только на целевых платформах
    "R0801",  # duplicate-code
    "R0902",  # too-many-instance-attributes
    "R0903",  # too-few-public-methods
    "R0911",  # too-many-return-statements
    "R0912",  # too-many-branches
    "R0913",  # too-many-arguments
    "R0914",  # too-many-locals
    "R0915",  # too-many-statements
    "R0917",  # too-many-positional-arguments
    "R1702",  # too-many-nested-blocks
    "R1705",  # no-else-return
    "R1710",  # inconsistent-return-statements
    "R1716",  # chain-comparison
    "R1732",  # consider-using-with
]