name: Build Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        type: choice
        required: false
        default: 'x'
        options:
          - x
          - y
          - z
      no_installer:
        description: 'Skip installer build'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'

      - name: Install 7-Zip
        run: |
          choco install 7zip -y --no-progress
          echo "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Download Python embeddable runtime
        run: |
          $runtimeUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $runtimeZip = "python-embed.zip"
          Write-Host "Downloading Python embeddable runtime..."
          Invoke-WebRequest -Uri $runtimeUrl -OutFile $runtimeZip
          Write-Host "Extracting runtime..."
          Expand-Archive -Path $runtimeZip -DestinationPath runtime -Force
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "runtime/get-pip.py"
          cd runtime
          .\python.exe get-pip.py
          cd ..
          Remove-Item $runtimeZip
          Write-Host "Runtime ready at $(Get-Location)/runtime"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine bump type
        id: bump
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $bump = "${{ github.event.inputs.bump }}"
            Write-Host "Using manual bump from input: $bump"
          } else {
            $parents = git log -1 --pretty=%P HEAD
            $parentCount = ($parents -split '\s+').Where({ $_ }).Count
            if ($parentCount -gt 1) {
              $mergeCommits = [int](git rev-list --count ^HEAD^1 HEAD)
              Write-Host "Merge commit detected with $mergeCommits commits in branch"
              if ($mergeCommits -gt 20) {
                $bump = "x"
                Write-Host "More than 20 commits -> MAJOR bump (x+1)"
              } else {
                $bump = "y"
                Write-Host "20 or fewer commits -> MINOR bump (y+1)"
              }
            } else {
              $bump = "z"
              Write-Host "Direct commit -> PATCH bump (z+1)"
            }
          }
          echo "bump=$bump" >> $env:GITHUB_OUTPUT

      - name: Get latest version from GitHub
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
            Authorization = "******"
          }
          $releaseUrl = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/latest"
          try {
            $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
            $latestTag = [string]$release.tag_name
            if ($latestTag -notmatch '^v?(\d+\.\d+\.\d+)$') {
              throw "Latest GitHub release has an invalid version tag: $latestTag"
            }
            $version = $Matches[1]
            Write-Host "Latest GitHub release: $latestTag"
            Write-Host "Latest version: $version"
          } catch {
            if ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404) {
              $version = "0.0.0"
              Write-Host "No GitHub releases found, starting from v$version"
            } else {
              throw
            }
          }
          echo "latest_version=$version" >> $env:GITHUB_OUTPUT

      - name: Compute and write version
        id: write-version
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest_version }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
        run: |
          $latestVersion = $env:LATEST_VERSION
          $bump = $env:BUMP_TYPE

          $p = $latestVersion.Split('.')
          $z = [int]$p[0]; $y = [int]$p[1]; $x = [int]$p[2]
          switch ($bump.ToLowerInvariant()) {
            'z' { $z++; $y = 0; $x = 0 }
            'y' { $y++; $x = 0 }
            'x' { $x++ }
          }
          $newVersion = "$z.$y.$x"
          Write-Host "Computed new version: v$newVersion (bump: $bump)"

          $content = """Версия приложения Obxod-BOX.""" + "`n`n__version__ = `"$newVersion`"" + "`n"
          Set-Content -Path "version.py" -Value $content -Encoding utf8
          Write-Host "Written __version__ = $newVersion to version.py"

          echo "new_version=$newVersion" >> $env:GITHUB_OUTPUT

      - name: Build Release
        id: build
        working-directory: ${{ github.workspace }}
        env:
          LATEST_VERSION: ${{ steps.version.outputs.latest_version }}
          BUMP_TYPE: ${{ steps.bump.outputs.bump }}
          NEW_VERSION: ${{ steps.write-version.outputs.new_version }}
          NO_INSTALLER: ${{ github.event.inputs.no_installer }}
        run: |
          $latestVersion = $env:LATEST_VERSION
          $bump = $env:BUMP_TYPE
          $newVersion = $env:NEW_VERSION
          $noInstaller = $env:NO_INSTALLER

          Write-Host "Working directory: $(Get-Location)"
          Write-Host "Building from v$latestVersion -> v$newVersion with bump '$bump'"
          if ($noInstaller -eq 'true') {
            & "${{ github.workspace }}\mkbuild.ps1" -BaseVersion $latestVersion -Bump $bump -NoInstaller
          } else {
            & "${{ github.workspace }}\mkbuild.ps1" -BaseVersion $latestVersion -Bump $bump
          }

      - name: Find built artifacts
        id: artifacts
        run: |
          $version = "${{ steps.write-version.outputs.new_version }}"
          $bundleDir = ".\build-bundle"

          $installer = Get-ChildItem -LiteralPath $bundleDir -Filter "Obxod-BOX-Setup-v$version.exe" | Select-Object -First 1
          if ($installer) {
            echo "installer_path=$($installer.FullName)" >> $env:GITHUB_OUTPUT
            Write-Host "Installer: $($installer.FullName)"
          } elseif ("${{ inputs.no_installer }}" -ne "true") {
            throw "Installer not found for version $version"
          }
          $bundleDirPath = Join-Path $bundleDir "obxod-box-v$version"
          if (-not (Test-Path -LiteralPath $bundleDirPath -PathType Container)) {
            throw "Bundle directory not found for version $version`: $bundleDirPath"
          }
          $bundleArchive = Join-Path $bundleDir "obxod-box-v$version-bundle.zip"
          Compress-Archive -Path $bundleDirPath -DestinationPath $bundleArchive -CompressionLevel Optimal -Force
          echo "bundle_path=$bundleArchive" >> $env:GITHUB_OUTPUT
          Write-Host "Bundle archive: $bundleArchive"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v${{ steps.artifacts.outputs.version }}
          name: Release v${{ steps.artifacts.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.artifacts.outputs.bundle_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts for manual download
        uses: actions/upload-artifact@v4
        with:
          name: obxod-box-release-${{ steps.artifacts.outputs.version }}
          path: |
            ${{ steps.artifacts.outputs.installer_path }}
            ${{ steps.artifacts.outputs.bundle_path }}
          retention-days: 90
